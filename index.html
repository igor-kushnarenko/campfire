<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Костёр у озера</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"><div class="hint">Нажмите любую кнопку или коснитесь экрана — включится звук.<br><small>Перетащите полено из поленницы в костёр · топор у пня колет новые дрова · меню — в правом нижнем углу</small></div></div>
<div id="toast" class="glass"></div>
<div id="hud" class="glass">
  <div class="row">
    <div class="seggroup" id="logtype" role="radiogroup" aria-label="Какие дрова бросать"></div>
  </div>
  <div class="row">
    <button id="add" type="button" class="primary"><svg viewBox="0 0 16 16"><path d="M2 11l10-5 2 2-10 5z M3 6l8 4" stroke="currentColor" fill="none" stroke-width="1.6"/></svg><span>Подбросить дрова</span></button>
    <button id="douse" type="button"><svg viewBox="0 0 16 16"><path d="M8 2C6 6 4 8 4 10.5a4 4 0 008 0C12 8 10 6 8 2z" fill="currentColor"/></svg><span>Потушить</span></button>
  </div>
  <div class="row">
    <button id="rain" type="button" class="icon" aria-pressed="false" title="Дождь"><svg viewBox="0 0 16 16"><path d="M4 9a3 3 0 01.5-6 4 4 0 017.4 1.3A2.5 2.5 0 0112 9z" fill="currentColor"/><path d="M5 11l-1 3M8 11l-1 3M11 11l-1 3" stroke="currentColor" stroke-width="1.3"/></svg><span>Дождь</span></button>
    <button id="volbtn" type="button" class="icon" aria-expanded="false" title="Громкость слоёв"><svg viewBox="0 0 16 16"><path d="M3 2v12M8 2v12M13 2v12" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="9" width="3" height="2" fill="currentColor"/><rect x="6.5" y="4" width="3" height="2" fill="currentColor"/><rect x="11.5" y="7" width="3" height="2" fill="currentColor"/></svg><span>Громкость</span></button>
    <button id="mute" type="button" class="icon" aria-label="Звук"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 010 5" stroke="currentColor" fill="none" stroke-width="1.4"/></svg><span>Звук</span></button>
    <button id="fs" type="button" class="icon" aria-label="На весь экран"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" stroke="currentColor" fill="none" stroke-width="1.6"/></svg></button>
  </div>
  <label class="rainlvl" title="Сила дождя"><span>Сила дождя</span><input id="rainlvl" type="range" min="0" max="100" step="5" aria-label="Сила дождя"></label>
  <div id="volumes" hidden></div>
  <div id="testrow" class="seggroup test" hidden><span class="tlabel">ТЕСТ · скорость времени</span></div>
  <div id="info"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
